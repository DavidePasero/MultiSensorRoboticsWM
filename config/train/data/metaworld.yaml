dataset:
  type: metaworld
  name: metaworld
  preprocessed: true
  num_steps: ${eval:'${wm.num_preds} + ${wm.history_size}'}
  frameskip: 1
  keys_to_load:
    - pixels
    - depth
    - tactile
    - proprio
    - force_torque
    - action
  keys_to_cache:
    - action
    - proprio
    - force_torque
