dataset:
  type: metaworld
  name: metaworld
  num_steps: ${eval:'${wm.num_preds} + ${wm.history_size}'}
  frameskip: 1
  shard_glob: null
  shard_paths: []
  max_cached_shards_per_worker: 1
  keys_to_load:
    - pixels
    - depth
    - tactile
    - proprio
    - force_torque
    - action
  keys_to_cache:
    - action
    - proprio
    - force_torque
