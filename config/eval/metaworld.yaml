defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: swm/SensorMetaWorld-v0
  num_envs: ${eval.num_eval}
  max_episode_steps: ???
  history_size: 1
  frame_skip: 1
  metaworld_env_name: reach-v3
  randomize_every_reset: true
  goal_tolerance: 0.05

dataset:
  stats: ${eval.dataset_name}
  keys_to_load:
    - pixels
    - depth
    - tactile
    - proprio
    - force_torque
    - action
    - qpos
    - qvel
    - rand_vec
    - target_pos
    - hand_start_pos
    - episode_idx
    - step_idx
    - env_idx
  keys_to_cache:
    - action
    - proprio
    - force_torque
  keys_to_process:
    - action
    - proprio
    - force_torque
  cache_all_loaded: false

seed: 42
policy: random

plan_config:
  horizon: 25
  receding_horizon: 5
  action_block: 1

eval:
  num_eval: 10
  goal_offset_steps: 25
  eval_budget: 50
  goal_sampling: first_success
  goal_success_key: success
  img_size: 224
  render_size: 128
  pixels_gaussian_blur:
    enabled: false
    probability: 1.0
    kernel_size: 5
    sigma_min: 0.0
    sigma_max: 1.5
  drop_modality: null
  drop_modalities: []
  dataset_name: metaworld_eval
  callables:
    - method: _set_state
      args:
        qpos:
          value: qpos
        qvel:
          value: qvel
        rand_vec:
          value: rand_vec
        target_pos:
          value: target_pos
        hand_start_pos:
          value: hand_start_pos
    - method: _set_goal_state
      args:
        target_pos:
          value: goal_target_pos

output:
  filename: metaworld_results.txt
